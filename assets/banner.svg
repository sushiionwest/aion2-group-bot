<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1376" height="768" viewBox="0 0 1376 768">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="55%" stop-color="#f9c3d6"/>
      <stop offset="100%" stop-color="#e898b8"/>
    </radialGradient>
    <linearGradient id="gemL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffc4d9"/>
    </linearGradient>
    <linearGradient id="gemR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa9c8"/>
      <stop offset="100%" stop-color="#f27aa9"/>
    </linearGradient>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="heart" d="M 0 9 C -14 -1 -12 -13 -5 -13 C -2 -13 0 -11 0 -8 C 0 -11 2 -13 5 -13 C 12 -13 14 -1 0 9 Z"/>
    <polygon id="spark" points="0,-23 5,-5 23,0 5,5 0,23 -5,5 -23,0 -5,-5"/>
  </defs>

  <rect width="1376" height="768" fill="url(#bg)"/>
  <g transform="translate(170,600) scale(1.5)" fill="#ffffff" opacity="0.95">
    <ellipse cx="0" cy="0" rx="110" ry="42"/><circle cx="-52" cy="-26" r="40"/><circle cx="4" cy="-46" r="52"/><circle cx="58" cy="-22" r="36"/>
  </g>
  <g transform="translate(1180,640) scale(1.7)" fill="#ffffff" opacity="0.95">
    <ellipse cx="0" cy="0" rx="110" ry="42"/><circle cx="-52" cy="-26" r="40"/><circle cx="4" cy="-46" r="52"/><circle cx="58" cy="-22" r="36"/>
  </g>
  <g transform="translate(700,720) scale(2.2)" fill="#ffffff" opacity="0.9">
    <ellipse cx="0" cy="0" rx="110" ry="42"/><circle cx="-52" cy="-26" r="40"/><circle cx="4" cy="-46" r="52"/><circle cx="58" cy="-22" r="36"/>
  </g>
  <g transform="translate(380,170) scale(0.9)" fill="#ffffff" opacity="0.7">
    <ellipse cx="0" cy="0" rx="110" ry="42"/><circle cx="-52" cy="-26" r="40"/><circle cx="4" cy="-46" r="52"/><circle cx="58" cy="-22" r="36"/>
  </g>
  <g transform="translate(1090,150) scale(1.0)" fill="#ffffff" opacity="0.7">
    <ellipse cx="0" cy="0" rx="110" ry="42"/><circle cx="-52" cy="-26" r="40"/><circle cx="4" cy="-46" r="52"/><circle cx="58" cy="-22" r="36"/>
  </g>
  <g transform="translate(60,330) scale(0.8)" fill="#ffffff" opacity="0.55">
    <ellipse cx="0" cy="0" rx="110" ry="42"/><circle cx="-52" cy="-26" r="40"/><circle cx="4" cy="-46" r="52"/><circle cx="58" cy="-22" r="36"/>
  </g>
  <g transform="translate(1330,380) scale(0.9)" fill="#ffffff" opacity="0.55">
    <ellipse cx="0" cy="0" rx="110" ry="42"/><circle cx="-52" cy="-26" r="40"/><circle cx="4" cy="-46" r="52"/><circle cx="58" cy="-22" r="36"/>
  </g>
  <use href="#heart" transform="translate(250,330) scale(3.2) rotate(-16)" fill="#ff6fa3"/>
  <use href="#heart" transform="translate(1130,300) scale(2.6) rotate(14)" fill="#ff6fa3"/>
  <use href="#heart" transform="translate(520,120) scale(1.7) rotate(10)" fill="#ffffff"/>
  <use href="#heart" transform="translate(900,96) scale(1.4) rotate(-8)" fill="#ffffff"/>
  <use href="#heart" transform="translate(948,588) scale(1.8) rotate(-10)" fill="#ffffff"/>
  <use href="#heart" transform="translate(452,566) scale(1.6) rotate(12)" fill="#ffffff"/>
  <use href="#spark" transform="translate(400,440) scale(0.9) rotate(0)" fill="#ffffff"/>
  <use href="#spark" transform="translate(980,430) scale(1.0) rotate(0)" fill="#ffffff"/>
  <use href="#spark" transform="translate(160,160) scale(0.7) rotate(0)" fill="#fff6d6"/>
  <use href="#spark" transform="translate(1240,170) scale(0.8) rotate(0)" fill="#fff6d6"/>
  <use href="#spark" transform="translate(640,70) scale(0.5) rotate(0)" fill="#ffffff"/>
  <use href="#spark" transform="translate(868,236) scale(0.5) rotate(0)" fill="#fff6d6"/>

  <!-- the kisk, centred -->
  <g transform="translate(432,128)">
    <circle cx="256" cy="240" r="124" fill="#ffffff" opacity="0.6" filter="url(#blurBig)"/>

    <!-- right wing (three feathers), mirrored for the left -->
    <g fill="#ffffff">
      <path d="M 318 236 Q 420 168 462 84 Q 402 186 314 258 Z" opacity="0.95"/>
      <path d="M 320 264 Q 434 232 474 168 Q 412 254 318 288 Z" opacity="0.8"/>
      <path d="M 318 296 Q 424 296 462 254 Q 408 318 314 318 Z" opacity="0.62"/>
    </g>
    <g fill="#ffffff" transform="translate(512,0) scale(-1,1)">
      <path d="M 318 236 Q 420 168 462 84 Q 402 186 314 258 Z" opacity="0.95"/>
      <path d="M 320 264 Q 434 232 474 168 Q 412 254 318 288 Z" opacity="0.8"/>
      <path d="M 318 296 Q 424 296 462 254 Q 408 318 314 318 Z" opacity="0.62"/>
    </g>

    <!-- halo the kisk floats over -->
    <ellipse cx="256" cy="424" rx="140" ry="28" fill="#fff3c4" opacity="0.5" filter="url(#blurSoft)"/>
    <ellipse cx="256" cy="420" rx="126" ry="25" fill="none" stroke="#ffe08a" stroke-width="8" opacity="0.95"/>
    <ellipse cx="256" cy="420" rx="126" ry="25" fill="none" stroke="#fffbe8" stroke-width="3"/>

    <!-- crystal -->
    <polygon points="256,88 182,214 256,400" fill="url(#gemL)"/>
    <polygon points="256,88 330,214 256,400" fill="url(#gemR)"/>
    <polygon points="256,88 221,214 256,400 291,214" fill="#ffffff" opacity="0.38"/>
    <polygon points="256,88 182,214 256,400 330,214" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>

    <!-- face -->
    <ellipse cx="236" cy="228" rx="7" ry="9" fill="#7a3b55"/>
    <ellipse cx="276" cy="228" rx="7" ry="9" fill="#7a3b55"/>
    <circle cx="238.5" cy="224.5" r="2.6" fill="#ffffff"/>
    <circle cx="278.5" cy="224.5" r="2.6" fill="#ffffff"/>
    <path d="M 247 243 Q 256 252 265 243" fill="none" stroke="#7a3b55" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="220" cy="246" rx="11" ry="7" fill="#ff7fab" opacity="0.6"/>
    <ellipse cx="292" cy="246" rx="11" ry="7" fill="#ff7fab" opacity="0.6"/>
  </g>
